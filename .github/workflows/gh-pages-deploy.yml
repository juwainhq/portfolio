name: Deploy to GitHub Pages

# Deploys the static Next.js export to GitHub Pages (site: /portfolio).
# - Auto-deploys on push to main
# - Can be run manually on any branch (Actions → this workflow → Run workflow)
#   to preview a branch live before merging.
#
# Pages must be configured with source "GitHub Actions" (build_type=workflow);
# do NOT point the Pages settings at a source branch — a Next.js source branch
# has no index.html, so GitHub would render the README instead of the site.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for GitHub Pages
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: "/portfolio"

      # Safety net: skip Jekyll processing if the site is ever rebuilt from
      # a branch instead of this artifact (protects the _next/ directory).
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
